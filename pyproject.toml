[project]
name = "wsml-project"
version = "0.1.0"
description = "Letterboxd scraping, data processing, ML modeling, and Streamlit analytics application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "catboost",
    "coverage>=7.13.0",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "pip>=25.3",
    "playwright>=1.55.0",
    "polars>=1.36.1",
    "pydantic>=2.12.5",
    "pyinstrument>=5.1.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "requests>=2.32.5",
    "rich>=13.7.0",
    "scalene>=1.5.55",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "streamlit>=1.52.2",
    "tenacity>=9.1.2",
    "tqdm>=4.67.1",
]

[project.scripts]
letterboxd-scrape = "scraping.scrapers.batch_scraper:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/scraping/tests", "src/ml/tests", "tests"]
